# git-cliff configuration — generate CHANGELOG.md from Conventional Commits.
# Used by `just changelog` and `just ship`. Install: cargo install git-cliff
#   (or: winget install git-cliff). If git-cliff is absent, those recipes SKIP
#   gracefully and you edit CHANGELOG.md by hand.
# Docs: https://git-cliff.org

[changelog]
header = """
# Changelog

All notable changes to this project are documented here.
This file is generated from Conventional Commits — edit commit messages, not this file.\n
"""
# A release section. `version` is the tag (or "unreleased").
body = """
{% if version %}\
## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
## [unreleased]
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | upper_first }}
{% for commit in commits %}\
- {{ commit.message | upper_first }}{% if commit.breaking %} **[breaking]**{% endif %}
{% endfor %}\
{% endfor %}\n
"""
trim = true
footer = ""

[git]
conventional_commits = true
filter_unconventional = true
split_commits = false
# Map commit prefixes to changelog sections; drop noise from the changelog.
commit_parsers = [
    { message = "^feat", group = "Features" },
    { message = "^fix", group = "Bug Fixes" },
    { message = "^perf", group = "Performance" },
    { message = "^refactor", group = "Refactor" },
    { message = "^docs", group = "Documentation" },
    { message = "^build", group = "Build System" },
    { message = "^ci", group = "CI" },
    { message = "^revert", group = "Reverts" },
    { message = "^style", skip = true },
    { message = "^test", skip = true },
    { message = "^chore\\(deps\\)", skip = true },
    { message = "^chore", group = "Chores" },
    { message = ".*", group = "Other" },
]
protect_breaking_commits = true
filter_commits = false
tag_pattern = "v[0-9]*"
topo_order = false
sort_commits = "oldest"
